  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

; border: 1px solid #E4EDF6; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 8px 24px rgba(18,43,84,0.12); padding: {{ cardPad }}; max-height: {{ cardMaxH }}px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #C3D7E9 transparent; box-sizing: border-box; transition: top 320ms cubic-bezier(.2,.7,.2,1), opacity 220ms ease, transform 320ms cubic-bezier(.2,.7,.2,1); cursor: default;\">\n        <div style=\"font-size: {{ titleSize }}px; line-height: 1.25; font-weight: 700; color: #003781; margin-bottom: 2px; text-wrap: pretty;\">{{ leftCard.title }}<\u002Fdiv>\n        <sc-if value=\"{{ leftCard.hasBy }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size: 14px; line-height: 20px; font-weight: 600; color: #006192; margin-bottom: 12px;\">{{ leftCard.by }}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ leftCard.paras }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"margin: 0; font-size: {{ bodySize }}px; line-height: 1.5; font-weight: {{ p.w }}; color: {{ p.c }}; text-wrap: pretty;\">{{ p.t }}<\u002Fp><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position: relative; min-width: 0; display: flex; justify-content: center;\">\n      <svg ref=\"{{ svgRef }}\" sc-camel-view-box=\"280 0 1000 960\" sc-camel-on-mouse-leave=\"{{ unhover }}\" style=\"display: block; width: 100%; max-width: {{ buildingMax }}; height: auto; aspect-ratio: 1000 / 960; user-select: none;\">\n        <image href=\"c04666c5-ed8c-4e85-bdad-5ff3755d60c7\" x=\"0\" y=\"0\" width=\"1536\" height=\"1024\" sc-camel-preserve-aspect-ratio=\"none\"><\u002Fimage>\n        <sc-for list=\"{{ floors }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <g sc-camel-on-mouse-enter=\"{{ f.enter }}\" sc-camel-on-click=\"{{ f.click }}\" style=\"cursor: pointer;\">\n            <polygon points=\"{{ f.pts }}\" fill=\"#13A0D3\" stroke=\"#13A0D3\" stroke iv>\n\n    {{ connector }}\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isStack }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top: 12px; display: flex; flex-direction: column; gap: 12px;\">\n      <sc-if value=\"{{ hasStackCard }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ stop }}\" style=\"background: #ffffff; border-radius: 8px; border: 1px solid #E4EDF6; box-shadow: 0 1px 2px rgba(16,24,40,0.05), 0 8px 24px rgba(18,43,84,0.12); padding: 16px 20px; animation: bx-in 260ms ease-out;\">\n          <div style=\"font-size: 18px; line-height: 1.25; font-weight: 700; color: #003781; margin-bottom: 2px;\">{{ stackCard.title }}<\u002Fdiv>\n        <sc-if value=\"{{ stackCard.hasBy }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size: 14px; line-height: 20px; font-weight: 600; color: #006192; margin-bottom: 12px;\">{{ stackCard.by }}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ stackCard.paras }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"margin: 0; font-size: 16px; line-height: 1.5; font-weight: {{ p.w }}; color: {{ p.c }}; text-wrap: pretty;\">{{ p.t }}<\u002Fp><\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showHint }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top: 8px; text-align: center; font-size: 14px; line-height: 20px; color: #5A6F8E;\">Hover or tap a floor to explore<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;floorRange&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Ground to 7th floor&quot;,&quot;1st floor to terrace&quot;],&quot;default&quot;:&quot;Ground to 7th floor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultFloor&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;floors&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{title:string,text:string}[]&quot;}}\">\nconst VB = { x: 280, y: 0, w: 1000, h: 960 };\nconst LW = { x: [318, 505], y: [[945,765,697,628,560,492,422,352,290,225],[945,752,680,612,540,470,400,330,262,200]] };\nconst CB = { x: [508, 555, 805, 1000], y: [[945,760,690,615,535,455,375,293,212,120],[945,760,690,615,535,455,375,293,212,120],[945,740,660,575,490,405,322,240,150,30],[945,770,700,625,548,470,390,312,230,200]] };\nconst ALL = { x: [318, 505, 508, 555, 805, 1000, 1135, 1250], y: [LW.y[0], LW.y[1], CB.y[0], CB.y[1], CB.y[2], CB.y[3], [900,769,699,632,561,491,421,349,310,310], [900,784,743,676,606,535,465,398,376,376]] };\nconst poly = (P, f) => P.x.map((X, i) => X + ',' + P.y[i][f + 1]).concat(P.x.map((X, i) => X + ',' + P.y[i][f]).reverse()).join(' ');\nconst RW = [900,784,743,676,606,535,465,398,376,376];\nconst anchorsFor = off => Array.from({ length: 8 }, (_, i) => { const f = i + off; return (i % 2 === 0)\n  ? { x: 318, y: (LW.y[0][f] + LW.y[0][f + 1]) / 2 }\n  : { x: 1248, y: (RW[f] + RW[f + 1]) / 2 }; });\nconst DEFAULT_FLOORS = [\n {\n  \"title\": \"Allianz R&D Hub\",\n  \"by\": \"by Allianz Technology\",\n  \"lead\": \"Innovation doesn't just happen. We make it happen.\",\n  \"paras\": [\n   \"The Allianz Technology R&D Hub empowers colleagues across Allianz to transform ideas into tangible outcomes and business value. By connecting business teams, technology experts, customers, startups, and academic partners, the Hub provides the ecosystem needed to explore new opportunities, solve complex challenges, and accelerate innovation across the Group.\",\n   \"At the Campus Innovation Day, discover how the R&D Hub supports innovation through cross-functional collaboration, technology enablement, external partnerships, innovation methods, and dedicated R&D Centers. Learn how colleagues can contribute ideas, join innovation initiatives, experiment with emerging technologies, and help shape the next generation of solutions for Allianz.\",\n   \"Visit our booth to explore current innovation initiatives, meet the team behind the Allianz Technology R&D Hub, and learn how you can help drive innovation forward across Allianz.\"\n  ]\n },\n {\n  \"title\": \"AI Avatar\",\n  \"by\": \"by R&D Center, powered by MS\",\n  \"paras\": [\n   \"The AI Avatar represents a future visitor experience where contextual information is accessible at any time on a natural conversation basis. Rather than replacing human interaction, it complements it, creating a seamless and engaging way to explore complex topics.\",\n   \"The AI Avatar of Dr. Axel Schell, CTO and Head of Innovation of Allianz Technology, acts as the digital host at the R&D Center. He introduces the experience, provides orientation, and sets the stage for the visitors’ journey through the Future, Now, and Next of the world of Insurance. Visitors can also ask individual questions.\"\n  ]\n },\n {\n  \"title\": \"Future of Insurance\",\n  \"by\": \"by Allianz Technology\",\n  \"paras\": [\n   \"As technology accelerates, new categories of risk emerge faster than traditional products can adapt. This showcase highlights how anticipating change, rather than reacting to it, positions Allianz to lead in insurance innovation.\",\n   \"By exploring emerging coverages across automation, intelligence, and cosmic-era risks, we identify opportunities to shape new markets early, strengthen our relevance to future customers, and ensure our Operating Entities are ready to design and launch the products these risks will demand.\",\n   \"At the R&D Center, visitors step through three eras of tomorrow: the Automation Era, the Intelligence Era, and the Cosmic Era.\"\n  ]\n },\n {\n  \"title\": \"Ask the future a question (GrowthOS)\",\n  \"by\": \"by Accenture\",\n  \"paras\": [\n   \"In today's AI-driven world, teams often create more ideas and prototypes than they can validate, leading to overspending and a growing gap between investment and evidence.\",\n   \"GrowthOS from Accenture Song helps minimize risk in key decisions. Users can pose one business question and receive insights across four confidence levels: ask, test, anchor, and predict.\"\n  ],\n  \"close\": \"One question. Four confidence levels. Gain confidence before you commit.\"\n },\n {\n  \"title\": \"The next era of mobility\",\n  \"by\": \"by Allianz Partners Mobility & Solvd\",\n  \"lead\": \"Experience the future of mobility from behind the wheel in VR.\",\n  \"paras\": [\n   \"Allianz Partners Mobility and SOLVD are partnering with leading car manufacturers to build the future of data-driven insurance.\",\n   \"Real-time risk scoring reduces claims frequency and claims costs, while automated damage detection enables instant roadside assistance and faster claims handling.\"\n  ]\n },\n {\n  \"title\": \"Conversational AI\",\n  \"by\": \"by Allianz Technology\",\n  \"paras\": [\n   \"Millions of calls reach Allianz every year, and volume spikes faster than teams can hire or staff.\",\n   \"Conversational AI bots answer calls and chats immediately so customers are served rather than queued.\",\n   \"At Allianz Direct, contact center staff act as bot controllers and tune the customer experience themselves. Every conversation also becomes structured data that helps improve future interactions.\",\n   \"At the R&D Center, experience how customers can have natural conversations with Allianz and see AI customer service agents in action.\"\n  ]\n },\n {\n  \"title\": \"AI Hacker Station\",\n  \"by\": \"by Allianz Technology\",\n  \"paras\": [\n   \"The AI Hacker Station brings AI security to life through an interactive, gamified experience.\",\n   \"Visitors can step into real-world attack scenarios and see how AI systems can be compromised through prompt injection or experience the impact of deepfake-enabled social engineering attacks.\"\n  ]\n },\n {\n  \"title\": \"Prompt2App\",\n  \"by\": \"by Allianz Technology\",\n  \"paras\": [\n   \"Prompt2App highlights the power of rapid prototyping and AI-driven automation.\",\n   \"It demonstrates how Allianz Technology enables business units to move from idea to execution instantly, driving agility, reducing time-to-market, and shaping the future of digital insurance solutions.\"\n  ]\n }\n];\n\nclass Component extends DCLogic {\n  state = { hover: null, selected: null, geo: null, w: 1200 };\n  rootRef = React.createRef(); gridRef = React.createRef(); svgRef = React.createRef();\n  leftColRef = React.createRef(); rightColRef = React.createRef();\n  leftCardRef = React.createRef(); rightCardRef = React.createRef();\n  lastLeft = 1; lastRight = 2;\n\n  componentDidMount() {\n    const d = this.props.defaultFloor;\n    if (d >= 1 && d <= 8) this.setState({ selected: d });\n    this.ro = new ResizeObserver(() => this.measure());\n    if (this.rootRef.current) this.ro.observe(this.rootRef.current);\n    this.onKey = e => { if (e.key === 'Escape') this.setState({ selected: null, hover: null }); };\n    window.addEventListener('keydown', this.onKey);\n    this.measure();\n  }\n  componentWillUnmount() { this.ro && this.ro.disconnect(); window.removeEventListener('keydown', this.onKey); }\n  componentDidUpdate() { this.measure(); }\n\n  measure() {\n    const g = this.gridRef.current, s = this.svgRef.current, root = this.rootRef.current;\n    if (!g || !s || !root) return;\n    const r = g.getBoundingClientRect(), b = s.getBoundingClientRect();\n    const k = b.width / VB.w;\n    const geo = {\n      w: Math.round(root.clientWidth),\n      H: Math.round(r.height),\n      anchors: anchorsFor(this.off()).map(a => ({ x: Math.round(b.left - r.left + (a.x - VB.x) * k), y: Math.round(b.top - r.top + (a.y - VB.y) * k) })),\n      lEdge: this.leftColRef.current ? Math.round(this.leftColRef.current.getBoundingClientRect().right - r.left) : 0,\n      rEdge: this.rightColRef.current ? Math.round(this.rightColRef.current.getBoundingClientRect().left - r.left) : 0,\n      lh: this.leftCardRef.current ? this.leftCardRef.current.offsetHeight : 0,\n      rh: this.rightCardRef.current ? this.rightCardRef.current.offsetHeight : 0,\n    };\n    const key = JSON.stringify(geo);\n    if (key !== this._geoKey) { this._geoKey = key; this.setState({ geo, w: geo.w }); }\n  }\n\n  off() { return this.props.floorRange === '1st floor to terrace' ? 1 : 0; }\n  setHover = n => { if (this.state.hover !== n) this.setState({ hover: n }); };\n  select = (n, e) => { e && e.stopPropagation(); this.setState({ selected: n, hover: null }); };\n\n  renderVals() {\n    const floorsData = Array.isArray(this.props.floors) && this.props.floors.length ? this.props.floors : DEFAULT_FLOORS;\n    const { hover, selected, geo, w } = this.state;\n    const active = hover ?? selected;\n    const isStack = w < 640;\n    const small = w < 980;\n    const showMarkers = this.props.showMarkers ?? true;\n    if (active && active % 2 === 1) this.lastLeft = active;\n    if (active && active % 2 === 0) this.lastRight = active;\n    const card = n => { const d = floorsData[n - 1] || {}; const paras = (d.paras || (d.text ? [d.text] : [])).map(t => ({ t, w: 400, c: '#414141' })); if (d.lead) paras.unshift({ t: d.lead, w: 600, c: '#003781' }); if (d.close) paras.push({ t: d.close, w: 600, c: '#003781' }); return { n, title: d.title || '', by: d.by || '', hasBy: !!d.by, paras }; };\n\n    const floors = Array.from({ length: 8 }, (_, f) => {\n      const n = f + 1;\n      const isSel = selected === n, isAct = active === n;\n      return {\n        n, pts: poly(ALL, f + this.off()),\n        fillOp: isSel ? 0.34 : isAct ? 0.24 : 0,\n        strokeOp: isSel ? 0.9 : isAct ? 0.5 : 0,\n        enter: () => this.setHover(n),\n        click: e => this.select(n, e),\n      };\n    });\n\n    const H = geo ? geo.H : 0;\n    const place = (n, h) => {\n      if (!geo || !n) return 0;\n      const ay = geo.anchors[n - 1].y;\n      return Math.max(0, Math.min(ay - 34, Math.max(0, H - h)));\n    };\n    const leftTop = place(this.lastLeft, geo ? geo.lh : 0);\n    const rightTop = place(this.lastRight, geo ? geo.rh : 0);\n    const leftOn = !isStack && active && active % 2 === 1;\n    const rightOn = !isStack && active && active % 2 === 0;\n\n    let connector = null;\n    if (!isStack && active && geo) {\n      const a = geo.anchors[active - 1];\n      const left = active % 2 === 1;\n      const top = left ? leftTop : rightTop, h = left ? geo.lh : geo.rh;\n      const ex = left ? geo.lEdge : geo.rEdge;\n      const ty = Math.max(top + 20, Math.min(a.y, top + h - 20));\n      const mx = left ? ex + 12 : ex - 12;\n      const d = `M${a.x},${a.y} L${mx + (left ? 1 : -1) * Math.abs(ty - a.y) * 0},${a.y} L${mx},${ty} L${ex},${ty}`;\n      connector = React.createElement('svg', {\n        style: { position: 'absolute', left: 0, top: 0, width: '100%', height: '100%', overflow: 'visible', pointerEvents: 'none' }\n      }, React.createElement('g', { key: active + '-' + top, style: { animation: 'bx-fade 360ms ease-out' } },\n        React.createElement('path', { d, fill: 'none', stroke: '#003781', strokeWidth: 1.5, strokeDasharray: '4 4', strokeLinecap: 'round' }),\n        React.createElement('circle', { cx: ex, cy: ty, r: 4, fill: '#003781' })\n      ));\n    }\n\n\n    return {\n      rootRef: this.rootRef, gridRef: this.gridRef, svgRef: this.svgRef,\n      leftColRef: this.leftColRef, rightColRef: this.rightColRef,\n      leftCardRef: this.leftCardRef, rightCardRef: this.rightCardRef,\n      gridCols: isStack ? 'minmax(0,1fr)' : small ? 'minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr)' : 'minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1.1fr)',\n      sideDisplay: isStack ? 'none' : 'block',\n      buildingMax: isStack ? '520px' : '100%',\n      cardPad: small ? '14px 16px' : '20px 24px',\n      titleSize: small ? 18 : 20, bodySize: small ? 15 : 16,\n      floors, connector, cardMaxH: geo && geo.H ? geo.H : 2000,\n      leftCard: card(this.lastLeft), rightCard: card(this.lastRight),\n      leftTop, rightTop,\n      leftOpacity: leftOn ? 1 : 0, rightOpacity: rightOn ? 1 : 0,\n      leftTransform: leftOn ? 'none' : 'translateX(-8px)', rightTransform: rightOn ? 'none' : 'translateX(8px)',\n      leftPE: leftOn ? 'auto' : 'none', rightPE: rightOn ? 'auto' : 'none',\n      leftCardEnter: () => this.setHover(this.lastLeft), rightCardEnter: () => this.setHover(this.lastRight),\n      leftCardClick: e => this.select(this.lastLeft, e), rightCardClick: e => this.select(this.lastRight, e),\n      unhover: () => this.setHover(null),\n      clear: () => this.setState({ selected: null, hover: null }),\n      stop: e => e.stopPropagation(),\n      isStack, hasStackCard: isStack && !!active, stackCard: card(active || 1),\n      showHint: !active,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
